
version: '3.8'

services:
  nginx:
    image: vipin0102/nginx-swarm:v1
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - target: 80
        published: 7777
        protocol: tcp
        mode: ingress

    deploy:
      replicas: 3

      restart_policy:
        condition: on-failure

      update_config:
        parallelism: 1
        delay: 10s

      resources:
        limits:
          cpus: '0.50'
          memory: 256M

    networks:
      - nginx-network

networks:
  nginx-network:
    driver: overlay
